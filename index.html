<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Our Bubble Tea Diary</title>

<style>
body{
    font-family:"Microsoft YaHei",Arial,sans-serif;
    background:#fff7ef;
    padding:20px;
    color:#3b2a20;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin:15px 0;
    box-shadow:0 5px 18px #0001;
}

h1{
    font-size:32px;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid #ddd;
    box-sizing:border-box;
}

button{
    background:#8b5e3c;
    color:white;
    border:0;
    padding:12px 22px;
    border-radius:14px;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.num{
    font-size:28px;
    font-weight:bold;
}

.item{
    background:#fffaf5;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
    border-left:5px solid #d8a47f;
}

.tag{
    background:#f1dfcf;
    padding:4px 10px;
    border-radius:20px;
    margin:3px;
    display:inline-block;
}
</style>

</head>


<body>


<div class="card">

<h1>🧋 Our Bubble Tea Diary</h1>

<p>
两个人的奶茶记忆博物馆
</p>

</div>


<div class="card stat">

<div>
<div class="num" id="count">0</div>
杯奶茶
</div>


<div>
<div class="num" id="brands">0</div>
品牌
</div>


<div>
<div class="num" id="places">0</div>
城市
</div>

</div>



<div class="card">

<h2>🧋 新增奶茶</h2>


<div class="grid">

<input id="brand" placeholder="品牌">

<input id="name" placeholder="产品名称">

</div>


<div class="grid">

<input id="date" type="date">

<input id="place" placeholder="地点">

</div>


<textarea id="taste" placeholder="口味分析"></textarea>


<div class="grid">

<select id="sweet">

<option>正常糖</option>

<option>三分糖</option>

<option>五分糖</option>

<option>无糖</option>

</select>


<select id="score">

<option>★★★★★</option>

<option>★★★★</option>

<option>★★★</option>

<option>★★</option>

<option>★</option>

</select>

</div>


<textarea id="memory" placeholder="这杯奶茶的故事"></textarea>


<button id="add">
加入收藏
</button>


</div>



<div class="card">

<h2>📖 奶茶时间线</h2>


<input id="search" placeholder="搜索品牌、地点、口味">


<div id="list"></div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://pqldlyrpxktlbtbjiiki.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DwcDOsLICxVbqlEev7NiuA_r8M-f5Gq";


const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



let data=[];



async function loadData(){


const {data:rows,error}=await db
.from("tea_records")
.select("*")
.order("id",{ascending:false});


if(error){

console.log(error);

document.getElementById("list").innerHTML=
"数据库连接失败";

return;

}


data=rows||[];

render();


}



function render(){


let keyword =
document.getElementById("search").value||"";


let list=
document.getElementById("list");


list.innerHTML="";


document.getElementById("count").innerText=
data.length;


document.getElementById("brands").innerText=
[...new Set(data.map(x=>x.brand))].length;


document.getElementById("places").innerText=
[...new Set(data.map(x=>x.place))].length;



data
.filter(x=>
(
x.brand+
x.name+
x.place+
x.taste
)
.includes(keyword)
)
.forEach(x=>{


list.innerHTML+=`

<div class="item">

<b>
${x.brand} · ${x.name}
</b>

<br>

${x.date||""} |
${x.place||""}


<br>


<span class="tag">
${x.sweet||""}
</span>


<span class="tag">
${x.score||""}
</span>


<p>
${x.taste||""}
</p>


<p>
💭 ${x.memory||""}
</p>


</div>

`;

});


}




document.getElementById("add")
.onclick=async()=>{


const {error}=await db
.from("tea_records")
.insert({

brand:brand.value,

name:name.value,

date:date.value,

place:place.value,

taste:taste.value,

sweet:sweet.value,

score:score.value,

memory:memory.value

});


if(error){

alert(
"保存失败："+error.message
);

return;

}


alert("收藏成功");


loadData();


};



document.getElementById("search")
.oninput=render;



loadData();


</script>


</body>

</html>
